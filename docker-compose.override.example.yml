# Only needed on networks that inspect HTTPS (for example a corporate proxy).
# Symptom: "certificate signed by unknown authority" during the build or when the API calls Fake Store.
#
#   cp docker-compose.override.example.yml docker-compose.override.yml
#   export EXTRA_CA_BUNDLE=/path/to/your/proxy-root-or-bundle.pem
#   docker compose up --build
#
# docker compose picks up docker-compose.override.yml automatically. It is git-ignored.

services:
  api:
    build:
      secrets: [extra_ca]
    secrets: [extra_ca]
    environment:
      NODE_EXTRA_CA_CERTS: /run/secrets/extra_ca
  api-test:
    build:
      secrets: [extra_ca]

secrets:
  extra_ca:
    file: ${EXTRA_CA_BUNDLE:?set EXTRA_CA_BUNDLE to a PEM file}
